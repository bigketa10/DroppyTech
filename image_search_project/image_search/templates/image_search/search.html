{% extends 'base.html' %}

{% block title %}Search{% endblock %}

{% block content %}
    <div class="container">
        <h2>Upload an Image</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Upload Image</button>
        </form>

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
    </div>
{% endblock %}
