{% extends 'image_search/base.html' %}

{% block title %}Search{% endblock %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title text-center">Add your image or enter an image URL</h3>
                    </div>
                    <div class="card-body">
                        <form id="imageForm" method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                            {% csrf_token %}
                            <!-- File Upload Section -->
                            <div class="mb-3">
                                <label class="form-label">Upload an image:</label>
                                <div id="dropZone" class="border border-primary rounded text-center p-4 position-relative" style="height: 200px;">
                                    <p id="dropZoneText" class="text-muted position-absolute top-50 start-50 translate-middle">Drag and drop an image here, or click to select one.</p>
                                    <input 
                                        type="file" 
                                        id="fileInput" 
                                        name="image" 
                                        class="form-control d-none" 
                                        accept="image/*">
                                    <img id="previewImage" class="img-fluid d-none position-absolute top-50 start-50 translate-middle" style="max-height: 150px;" alt="Image Preview">
                                </div>
                            </div>
                            <div id="fileInfo" class="mt-3 d-none">
                                <p><strong>File Name:</strong> <span id="fileName"></span></p>
                                <p><strong>File Size:</strong> <span id="fileSize"></span></p>
                            </div>

                            <!-- OR Separator -->
                            <div class="text-center my-3">
                                <p>OR</p>
                            </div>

                            <!-- URL Input Section -->
                            <div class="mb-3">
                                <label for="urlInput" class="form-label">Enter the URL of an image:</label>
                                <input 
                                    type="url" 
                                    id="urlInput" 
                                    name="image_url" 
                                    class="form-control" 
                                    placeholder="https://example.com/image.jpg" 
                                    pattern="https?://.*" 
                                    title="Please enter a valid URL">
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mt-3">
                                <button type="submit" class="btn btn-primary">Submit</button>
                            </div>
                        </form>

                        <!-- Error Messages -->
                        {% if error %}
                            <div class="alert alert-danger mt-3" role="alert">
                                {{ error }}
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const previewImage = document.getElementById('previewImage');
        const dropZoneText = document.getElementById('dropZoneText');

        // Highlight drop zone when dragging files over it
        dropZone.addEventListener('dragover', (event) => {
            event.preventDefault();
            dropZone.classList.add('bg-light');
        });

        // Remove highlight when drag leaves drop zone
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('bg-light');
        });

        // Handle dropped files
        dropZone.addEventListener('drop', (event) => {
            event.preventDefault();
            dropZone.classList.remove('bg-light');
            const files = event.dataTransfer.files;
            if (files.length) {
                fileInput.files = files; // Assign files to input
                displayFileInfo(files[0]);
            }
        });

        // Trigger file input click on drop zone click
        dropZone.addEventListener('click', () => fileInput.click());

        // Handle file input change
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                displayFileInfo(fileInput.files[0]);
            }
        });

        // Display file information and preview
        function displayFileInfo(file) {
            if (!file) return;

            // Update file info
            fileName.textContent = file.name;
            fileSize.textContent = `${(file.size / 1024).toFixed(2)} KB`;
            fileInfo.classList.remove('d-none');

            // Display image preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewImage.classList.remove('d-none');
            };
            reader.readAsDataURL(file);

            // Keep the drop zone text visible
            dropZoneText.style.opacity = 0.5; // Fade text for emphasis
        }
    </script>
{% endblock %}
